<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚾ 11이닝 연장전 & 슈퍼캐치 3D 리얼 야구 시뮬레이터 ⚾</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', sans-serif;
            background: #020617;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden;
        }
        .game-card {
            width: 100%;
            max-width: 1020px;
            background: #0f172a;
            border-radius: 20px;
            padding: 15px;
            border: 2px solid #ef4444;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            text-align: center;
            margin: 0 auto;
        }
        h1 { font-size: 1.25rem; color: #ffc72c; margin-bottom: 8px; }

        /* 전광판 & 스코어보드 (11이닝 확장) */
        .dashboard {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }
        .match-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            border-bottom: 1px solid #334155;
            padding-bottom: 4px;
        }
        .scoreboard-container {
            overflow-x: auto;
        }
        .scoreboard-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.72rem;
            text-align: center;
            min-width: 600px;
        }
        .scoreboard-table th, .scoreboard-table td {
            padding: 2px 3px;
            border: 1px solid #334155;
        }
        .scoreboard-table th { background: #0f172a; color: #ffc72c; }
        .scoreboard-table .active-inning { background: #ef4444; color: #fff; font-weight: bold; }
        .team-score { font-weight: bold; color: #38bdf8; }

        .count-box { display: flex; gap: 10px; font-weight: 800; }
        .b-count { color: #22c55e; }
        .s-count { color: #eab308; }
        .o-count { color: #ef4444; }
        .highlight { color: #ffc72c; }

        /* 3D 야구장 뷰포트 */
        .perspective-container {
            width: 100%;
            height: 380px;
            perspective: 850px;
            overflow: hidden;
            border-radius: 16px;
            border: 3px solid #38bdf8;
            margin: 0 auto 10px auto;
            background: #020617;
            position: relative;
        }

        .ground-3d {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform: rotateX(60deg) translateY(0px) scale(1.15);
            transform-origin: center bottom;
            background: radial-gradient(circle at 50% 90%, #b45309 0%, #15803d 35%, #166534 80%, #064e3b 100%);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .outfield-fence {
            position: absolute;
            top: 15px; left: 5%; width: 90%; height: 300px;
            border-top: 8px solid #ef4444;
            border-radius: 50% 50% 0 0;
            box-shadow: 0 -10px 20px rgba(239, 68, 68, 0.6);
        }

        .infield-diamond {
            position: absolute;
            bottom: 45px; left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 135px; height: 135px;
            border: 3px dashed rgba(255, 255, 255, 0.6);
            background: rgba(180, 83, 9, 0.7);
        }
        .base {
            position: absolute; width: 14px; height: 14px; background: #fff; transform: rotate(-45deg);
            transition: background 0.3s;
        }
        .base.occupied { background: #ffc72c !important; box-shadow: 0 0 10px #ffc72c; }
        .base.b1 { top: -7px; right: -7px; }
        .base.b2 { top: -7px; left: -7px; }
        .base.b3 { bottom: -7px; left: -7px; }

        .pitcher-mound {
            position: absolute; bottom: 150px; left: 50%;
            transform: translateX(-50%);
            width: 28px; height: 28px; background: #d97706;
            border: 2px solid #fff; border-radius: 50%; z-index: 2;
        }

        .home-plate {
            position: absolute; bottom: 35px; left: 50%;
            transform: translateX(-50%);
            width: 22px; height: 16px; background: #fff;
            clip-path: polygon(50% 0%, 100% 50%, 100% 100%, 0% 100%, 0% 50%);
            z-index: 3;
        }

        /* 3D 인체 캐릭터 */
        .human-player {
            position: absolute;
            transform: translateX(-50%) rotateX(-60deg);
            transform-origin: bottom center;
            width: 45px; height: 70px;
            z-index: 8;
            transition: transform 0.2s ease, left 0.3s ease, bottom 0.3s ease;
        }
        .player-label {
            position: absolute; top: -16px; left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85); color: #ffc72c;
            padding: 1px 4px; border-radius: 4px; font-size: 0.55rem;
            white-space: nowrap; font-weight: bold; border: 1px solid #ffc72c;
        }

        /* 야수 포지션 */
        .catcher-pos { bottom: 12px; left: 50%; z-index: 4; }
        .pitcher-pos { bottom: 150px; left: 50%; z-index: 7; }
        .base1-pos   { bottom: 110px; left: 66%; }
        .base2-pos   { bottom: 180px; left: 58%; }
        .ss-pos      { bottom: 180px; left: 42%; }
        .base3-pos   { bottom: 110px; left: 34%; }
        .lf-pos      { bottom: 260px; left: 25%; }
        .cf-pos      { bottom: 300px; left: 50%; }
        .rf-pos      { bottom: 260px; left: 75%; }

        .runner-3d {
            position: absolute;
            transform: translateX(-50%) rotateX(-60deg);
            transform-origin: bottom center;
            width: 38px; height: 60px;
            z-index: 9; transition: all 0.3s linear; display: none;
        }

        .batter-wrap {
            position: absolute; bottom: 35px; left: 45%;
            transform: translateX(-50%) rotateX(-60deg);
            transform-origin: bottom center;
            width: 65px; height: 85px; z-index: 10;
        }

        .baseball-container {
            position: absolute; bottom: 160px; left: 50%;
            transform: translateX(-50%) rotateX(-60deg);
            z-index: 15; opacity: 0; pointer-events: none;
        }
        .baseball {
            width: 14px; height: 14px; background: #fff;
            border: 2px solid #ef4444; border-radius: 50%;
            box-shadow: 0 0 10px #ffffff;
        }
        .ball-shadow {
            position: absolute; bottom: -8px; left: 50%;
            transform: translateX(-50%);
            width: 12px; height: 4px; background: rgba(0,0,0,0.5);
            border-radius: 50%; filter: blur(1px);
        }

        /* 이펙트 연출 */
        .hit-effect {
            position: absolute; bottom: 80px; left: 50%;
            transform: translateX(-50%) rotateX(-60deg) scale(0.5);
            font-size: 1.8rem; font-weight: 900; color: #ffc72c;
            text-shadow: 0 0 12px #ef4444; opacity: 0;
            transition: all 0.2s ease; z-index: 20;
        }

        /* 컨트롤 및 확장 구종 패널 */
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }
        .pitch-selector { 
            display: flex; 
            gap: 5px; 
            justify-content: center; 
            flex-wrap: wrap; 
            max-width: 900px;
        }
        .btn-pitch {
            background: #334155; color: #fff; border: 1px solid #475569;
            padding: 5px 10px; border-radius: 8px; font-weight: bold;
            cursor: pointer; font-size: 0.78rem; transition: all 0.2s;
        }
        .btn-pitch.selected {
            background: #38bdf8; color: #020617; border-color: #38bdf8; box-shadow: 0 0 8px #38bdf8;
        }

        .action-group { display: flex; gap: 8px; justify-content: center; }
        .btn-act {
            background: linear-gradient(135deg, #ef4444 0%, #b3001b 100%);
            color: #fff; font-size: 1rem; font-weight: 900;
            padding: 10px 22px; border-radius: 10px; border: none;
            cursor: pointer; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }
        .btn-pickoff {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: #fff; font-size: 1rem; font-weight: 900;
            padding: 10px 22px; border-radius: 10px; border: none;
            cursor: pointer; box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4);
        }
        .btn-act:disabled, .btn-pickoff:disabled { opacity: 0.4; cursor: not-allowed; }

        .message {
            margin-top: 8px; font-size: 0.95rem;
            color: #ffc72c; font-weight: bold; min-height: 1.4em;
        }

        .human-svg { width: 100%; height: 100%; }

        /* 다이빙 슬라이딩 슈퍼캐치 애니메이션 */
        @keyframes superDive {
            0% { transform: translateX(-50%) rotateX(-60deg) scale(1); }
            50% { transform: translateX(-50%) rotateX(-20deg) rotateZ(-60deg) translateY(-30px) scale(1.1); }
            100% { transform: translateX(-50%) rotateX(-60deg) scale(1); }
        }
        .super-diving {
            animation: superDive 0.8s ease-in-out;
        }
    </style>
</head>

            'SF': { name: '포크볼', speed: 3.5, curveX: 0.05, isStrikeTarget: false, dropY: true },
            'CT': { name: '커터', speed: 4.6, curveX: -0.3, isStrikeTarget: true },
            'KN': { name: '너클볼', speed: 2.2, curveX: 0, isKnuckle: true, isStrikeTarget: false }
        };

        const ground3d = document.getElementById('ground3d');
        const actionBtn = document.getElementById('actionBtn');
        const pickoffBtn = document.getElementById('pickoffBtn');
        const message = document.getElementById('message');
        const ballContainer = document.getElementById('ballContainer');
        const batterWrap = document.getElementById('batterWrap');
        const batterArmBatGroup = document.getElementById('batterArmBatGroup');
        const pitcherArmGroup = document.getElementById('pitcherArmGroup');
        const hitEffect = document.getElementById('hitEffect');
        
        const ballsEl = document.getElementById('balls');
        const strikesEl = document.getElementById('strikes');
        const outsEl = document.getElementById('outs');
        const batterOrderEl = document.getElementById('batterOrder');
        const playerNumber = document.getElementById('playerNumber');
        const currentInningText = document.getElementById('currentInningText');

        function selectPitch(key, btn) {
            if (gameState !== 'IDLE') return;
            selectedPitchKey = key;
            document.querySelectorAll('.btn-pitch').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            message.textContent = `[${pitchConfig[key].name}] 구종이 선택되었습니다.`;
        }

        function handleGameAction() {
            if (gameState === 'IDLE') {
                startPitch();
            } else if (gameState === 'PITCHING') {
                swingBat();
            } else if (gameState === 'GAMEOVER') {
                resetGame();
            }
        }

        function updateCamera(bottom, left, scale = 1.3, rotateX = 58) {
            const offsetY = (bottom - 160) * 0.8;
            const offsetX = (50 - left) * 2.5;
            ground3d.style.transform = `rotateX(${rotateX}deg) translateY(${offsetY}px) translateX(${offsetX}px) scale(${scale})`;
        }

        function resetCamera() {
            ground3d.style.transform = 'rotateX(60deg) translateY(0px) translateX(0px) scale(1.15)';
        }

        function startPitch() {
            gameState = 'PITCHING';
            actionBtn.textContent = '💥 타격 (스윙)';
            pickoffBtn.disabled = true;

            const p = pitchConfig[selectedPitchKey];
            message.textContent = `투수가 [${p.name}]를 던집니다!`;

            pitcherArmGroup.setAttribute('transform', 'rotate(-90)');
            setTimeout(() => pitcherArmGroup.setAttribute('transform', 'rotate(0)'), 200);

            hitEffect.style.opacity = '0';
            ballPosY = 160;
            ballPosX = 50;

            ballContainer.style.opacity = '1';
            ballContainer.style.bottom = '160px';
            ballContainer.style.left = '50%';

            ballTimer = setInterval(() => {
                let speedY = p.speed;
                if (p.dropY && ballPosY < 90) speedY *= 1.4; // 포크볼 떨어지는 낙차 연출
                
                ballPosY -= speedY;

                // 너클볼 무작위 좌우 흔들림 연출
                if (p.isKnuckle) {
                    ballPosX += (Math.random() - 0.5) * 1.8;
                } else {
                    ballPosX += p.curveX;
                }

                ballContainer.style.bottom = ballPosY + 'px';
                ballContainer.style.left = ballPosX + '%';

                updateCamera(ballPosY, ballPosX, 1.35, 55);
                
                if (ballPosY <= 20) {
                    clearInterval(ballTimer);
                    if (p.isStrikeTarget && Math.abs(ballPosX - 50) < 6) {
                        processCall('STRIKE');
                    } else {
                        processCall('BALL');
                    }
                }
            }, 20);
        }

        function swingBat() {
            if (gameState !== 'PITCHING') return;
            clearInterval(ballTimer);

            batterArmBatGroup.setAttribute('transform', 'rotate(110)');
            const timingDiff = Math.abs(ballPosY - 45);

            if (timingDiff > 25) {
                processCall('SWING_MISS');
                return;
            }

            const rand = Math.random();
            if (timingDiff <= 6 && rand < 0.35) {
                processHitResult('HOMERUN');
            } else if (timingDiff <= 18 && rand < 0.6) {
                processHitResult('HIT');
            } else if (rand < 0.75) {
                // 슈퍼캐치 확률 적용 (외야 뜬공 중 30% 확률로 슈퍼 다이빙 캐치 발생)
                if (Math.random() < 0.3) {
                    processHitResult('SUPER_CATCH');
                } else {
                    processHitResult('FLY_OUT');
                }
            } else {
                if (runners.b1 && Math.random() < 0.6) {
                    processHitResult('DOUBLE_PLAY');
                } else {
                    processHitResult('GROUND_OUT');
                }
            }
        }

        function attemptPickoff() {
            if (!runners.b1 && !runners.b2 && !runners.b3) return;
            
            const pitcher = document.getElementById('pitcher');
            pitcher.style.transform = 'translateX(-50%) rotateX(-60deg) rotateY(180deg)';

            const isPickoffOut = Math.random() < 0.35;

            setTimeout(() => {
                pitcher.style.transform = 'translateX(-50%) rotateX(-60deg)';
                if (isPickoffOut) {
                    if (runners.b1) runners.b1 = false;
                    else if (runners.b2) runners.b2 = false;
                    else if (runners.b3) runners.b3 = false;

                    outs++;
                    message.textContent = '🎯 견제 성공!! 주자 아웃!';
                    showHitEffect('PICKOFF OUT!');
                } else {
                    message.textContent = '💨 견제구 세이프!';
                }
                updateRunnersUI();
                updateDashboard();
                checkInningChange();
            }, 500);
        }

        function processCall(type) {
            gameState = 'RESULT';
            if (type === 'STRIKE') {
                strikes++;
                message.textContent = '⚡ 루킹 스트라이크!';
                showHitEffect('STRIKE!');
            } else if (type === 'BALL') {
                balls++;
                message.textContent = '🟢 볼!';
                showHitEffect('BALL');
            } else if (type === 'SWING_MISS') {
                strikes++;
                message.textContent = '💨 헛스윙 스트라이크!';
                showHitEffect('SWING MISS');
            }

            if (balls >= 4) {
                message.textContent = '🚶 볼넷! 타자 진루';
                advanceRunners();
                resetCount();
            }
            if (strikes >= 3) {
                outs++;
                message.textContent = '🔥 삼진 아웃 (K!!)';
                showHitEffect('STRIKE OUT!');
                resetCount();
                currentBatterNum = (currentBatterNum % 9) + 1;
            }

            finishTurn();
        }

        function processHitResult(type) {
            gameState = 'RESULT';
            ballContainer.style.transition = 'all 0.8s cubic-bezier(0.1, 0.8, 0.25, 1)';

            if (type === 'HOMERUN') {
                let r = 1 + (runners.b1?1:0) + (runners.b2?1:0) + (runners.b3?1:0);
                addScore(r);
                runners = { b1: false, b2: false, b3: false };
                message.textContent = `💥 초대형 홈런!!! (+${r}점 득점)`;
                showHitEffect('HOMERUN!! 💥');
                flyBallAndFollow(300, 20);
            } else if (type === 'SUPER_CATCH') {
                outs++;
                message.textContent = '🌟 환상적인 다이빙 슈퍼캐치 포구 성공!! 아웃!';
                showHitEffect('SUPER CATCH!! 🦅');
                flyBallAndFollow(250, 50);
                performSuperDiveCatch(50, 250);
            } else if (type === 'HIT') {
                advanceRunners();
                message.textContent = '⚾ 안타! 진루 성공!';
                showHitEffect('HIT!! ⚾');
                flyBallAndFollow(190, 75);
                moveFieldersToBall(75, 190);
            } else if (type === 'FLY_OUT') {
                outs++;
                message.textContent = '🎈 외야 뜬공 포구 아웃!';
                showHitEffect('FLY OUT ✋');
                flyBallAndFollow(240, 50);
                moveFieldersToBall(50, 240);
            } else if (type === 'GROUND_OUT') {
                outs++;
                message.textContent = '⚡ 내야 땅볼 아웃!';
                showHitEffect('GROUND OUT');
                flyBallAndFollow(90, 60);
                moveFieldersToBall(60, 90);
            } else if (type === 'DOUBLE_PLAY') {
                outs += 2;
                runners.b1 = false;
                message.textContent = '🚨 병살타 (더블 플레이)!! 2아웃!';
                showHitEffect('DOUBLE PLAY!! 💥');
                flyBallAndFollow(100, 58);
                moveFieldersToBall(58, 100);
            }

            resetCount();
            currentBatterNum = (currentBatterNum % 9) + 1;
            finishTurn();
        }

        function addScore(pts) {
            if (isTopInning) {
                awayInningScores[currentInning - 1] += pts;
                awayTotalScore += pts;
            } else {
                homeInningScores[currentInning - 1] += pts;
                homeTotalScore += pts;
            }
        }

        function flyBallAndFollow(targetBottom, targetLeft) {
            ballContainer.style.bottom = targetBottom + 'px';
            ballContainer.style.left = targetLeft + '%';
            updateCamera(targetBottom, targetLeft, 1.4, 52);
        }

        function moveFieldersToBall(targetLeft, targetBottom) {
            const cf = document.getElementById('field_cf');
            cf.style.left = targetLeft + '%';
            cf.style.bottom = targetBottom + 'px';

            setTimeout(() => {
                cf.style.left = '50%';
                cf.style.bottom = '300px';
            }, 1800);
        }

        // 야수 몸을 날리는 슈퍼 다이빙 캐치 연출
        function performSuperDiveCatch(targetLeft, targetBottom) {
            const cf = document.getElementById('field_cf');
            cf.style.left = targetLeft + '%';
            cf.style.bottom = targetBottom + 'px';
            cf.classList.add('super-diving');

            setTimeout(() => {
                cf.classList.remove('super-diving');
                cf.style.left = '50%';
                cf.style.bottom = '300px';
            }, 1800);
        }

        function advanceRunners() {
            if (runners.b3) addScore(1);
            runners.b3 = runners.b2;
            runners.b2 = runners.b1;
            runners.b1 = true;
        }

        function resetCount() {
            balls = 0;
            strikes = 0;
        }

        function finishTurn() {
            updateDashboard();
            updateRunnersUI();

            setTimeout(() => {
                resetBatPosition();
                resetCamera();
                checkInningChange();
            }, 1800);
        }

        // 11이닝 연장전 공수교대 및 규정 적용
        function checkInningChange() {
            if (outs >= 3) {
                outs = 0;
                resetCount();
                runners = { b1: false, b2: false, b3: false };
                updateRunnersUI();

                if (isTopInning) {
                    // 9이닝 이후 및 연장전 11회말 끝내기 처리 검사
                    if (currentInning >= 9 && homeTotalScore > awayTotalScore) {
                        endGame();
                        return;
                    }
                    isTopInning = false;
                    message.textContent = `🔄 3아웃 공수교대! ${currentInning}회말 공격 시작!`;
                } else {
                    // 11이닝까지 모두 끝난 경우
                    if (currentInning >= 11) {
                        endGame();
                        return;
                    }
                    currentInning++;
                    isTopInning = true;
                    message.textContent = `🔄 3아웃 공수교대! ${currentInning}회초 수비 시작!`;
                }
                updateDashboard();
            }
            if (gameState !== 'GAMEOVER') {
                gameState = 'IDLE';
                actionBtn.textContent = '투구 시작!';
            }
        }

        function endGame() {
            gameState = 'GAMEOVER';
            actionBtn.textContent = '🔄 게임 다시 시작';
            pickoffBtn.disabled = true;

            let resultMsg = "";
            if (homeTotalScore > awayTotalScore) {
                resultMsg = `🎉 승리했습니다! (${homeTotalScore} : ${awayTotalScore})`;
            } else if (homeTotalScore < awayTotalScore) {
                resultMsg = `😭 패배했습니다. (${homeTotalScore} : ${awayTotalScore})`;
            } else {
                resultMsg = `🤝 11이닝 규정에 따라 무승부로 경기가 종료되었습니다! (${homeTotalScore} : ${awayTotalScore})`;
            }

            message.textContent = `🎮 경기 종료! ${resultMsg}`;
        }

        function updateRunnersUI() {
            document.getElementById('base1').classList.toggle('occupied', runners.b1);
            document.getElementById('base2').classList.toggle('occupied', runners.b2);
            document.getElementById('base3').classList.toggle('occupied', runners.b3);

            const r1 = document.getElementById('runner1');
            const r2 = document.getElementById('runner2');
            const r3 = document.getElementById('runner3');

            r1.style.display = runners.b1 ? 'block' : 'none';
            if (runners.b1) { r1.style.bottom = baseCoords.b1.bottom; r1.style.left = baseCoords.b1.left; }

            r2.style.display = runners.b2 ? 'block' : 'none';
            if (runners.b2) { r2.style.bottom = baseCoords.b2.bottom; r2.style.left = baseCoords.b2.left; }

            r3.style.display = runners.b3 ? 'block' : 'none';
            if (runners.b3) { r3.style.bottom = baseCoords.b3.bottom; r3.style.left = baseCoords.b3.left; }

            pickoffBtn.disabled = !(runners.b1 || runners.b2 || runners.b3);
        }

        function showHitEffect(txt) {
            hitEffect.textContent = txt;
            hitEffect.style.opacity = '1';
            hitEffect.style.transform = 'translateX(-50%) rotateX(-60deg) scale(1.1)';
        }

        function resetBatPosition() {
            batterArmBatGroup.setAttribute('transform', 'rotate(0)');
            ballContainer.style.transition = 'all 0.05s linear';
            ballContainer.style.opacity = '0';
            hitEffect.style.opacity = '0';

            playerNumber.textContent = currentBatterNum;
            batterOrderEl.textContent = `${currentBatterNum}번 타자`;
        }

        function updateDashboard() {
            ballsEl.textContent = balls;
            strikesEl.textContent = strikes;
            outsEl.textContent = outs;

            currentInningText.textContent = `${currentInning}회${isTopInning ? '초 (수비)' : '말 (공격)'}`;

            // 11이닝 전광판 표 업데이트
            for (let i = 1; i <= 11; i++) {
                const aCell = document.getElementById(`a${i}`);
                const hCell = document.getElementById(`h${i}`);

                aCell.classList.remove('active-inning');
                hCell.classList.remove('active-inning');

                if (i < currentInning || (i === currentInning && !isTopInning)) {
                    aCell.textContent = awayInningScores[i - 1];
                } else {
                    aCell.textContent = '-';
                }

                if (i < currentInning) {
                    hCell.textContent = homeInningScores[i - 1];
                } else if (i === currentInning && !isTopInning) {
                    hCell.textContent = homeInningScores[i - 1];
                } else {
                    hCell.textContent = '-';
                }

                if (i === currentInning) {
                    if (isTopInning) aCell.classList.add('active-inning');
                    else hCell.classList.add('active-inning');
                }
            }

            document.getElementById('awayTotalScore').textContent = awayTotalScore;
            document.getElementById('homeTotalScore').textContent = homeTotalScore;
        }

        function resetGame() {
            currentInning = 1;
            isTopInning = true;
            awayInningScores = Array(11).fill(0);
            homeInningScores = Array(11).fill(0);
            awayTotalScore = 0;
            homeTotalScore = 0;

            balls = 0;
            strikes = 0;
            outs = 0;
            currentBatterNum = 1;
            runners = { b1: false, b2: false, b3: false };
            gameState = 'IDLE';

            updateDashboard();
            updateRunnersUI();
            resetBatPosition();
            resetCamera();
            actionBtn.textContent = '투구 시작!';
            message.textContent = '1회초 경기 시작! 구종을 선택하고 투구하세요!';
        }
    </script>
</body>
  </html>
